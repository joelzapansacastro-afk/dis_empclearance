<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Professional Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* CARD */

.login-container{
    width:100%;
    max-width:400px;
    padding:20px;
}

.card{
    background: rgba(255,255,255,0.98);
    border-radius:20px;
    padding:40px 35px;
    box-shadow:
        0 10px 30px rgba(0,0,0,0.25),
        0 4px 10px rgba(0,0,0,0.08);

    backdrop-filter: blur(10px);
    animation: fadeIn 0.5s ease;
}

/* HEADER */

.logo{
    width:70px;
    height:70px;
    background:#2563eb;
    color:white;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:700;
    margin:0 auto 20px;
}

h2{
    text-align:center;
    color:#0f172a;
    margin-bottom:8px;
    font-size:28px;
    font-weight:700;
}

.subtitle{
    text-align:center;
    color:#64748b;
    margin-bottom:30px;
    font-size:14px;
}

/* INPUTS */

.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    color:#334155;
    font-weight:600;
}

input,
select{
    width:100%;
    padding:14px 16px;
    border:1px solid #cbd5e1;
    border-radius:12px;
    font-size:15px;
    transition:0.3s ease;
    background:#f8fafc;
}

input:focus,
select:focus{
    outline:none;
    border-color:#2563eb;
    background:white;
    box-shadow:0 0 0 4px rgba(37,99,235,0.15);
}

/* BUTTON */

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(to right, #2563eb, #1d4ed8);
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s ease;
    margin-top:10px;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(37,99,235,0.35);
}

/* FOOTER */

.footer{
    margin-top:20px;
    text-align:center;
    font-size:13px;
    color:#94a3b8;
}

/* ANIMATION */

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* MOBILE */

@media(max-width:480px){

    .card{
        padding:30px 24px;
    }

    h2{
        font-size:24px;
    }

}

</style>
</head>

<body>

<div class="login-container">

    <div class="card">

        <div class="logo">
            DIS
        </div>

        <h2>Employee Clearance</h2>
        <p class="subtitle">Login to continue</p>

        <div class="input-group">
            <label>Employee Number</label>
            <input id="username" type="text" placeholder="Enter employee number">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input id="password" type="password" placeholder="Enter password">
        </div>

        <div class="input-group">
            <label>Role</label>
            <select id="role">
                <option value="teacher">Teacher</option>
                <option value="signatory">Signatory</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <button type="button" onclick="login()">
            Login
        </button>

        <div class="footer">
            Secure Login System
        </div>

    </div>

</div>

<script>

window.onload = function () {
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
    document.getElementById("role").selectedIndex = 0;
};

async function login() {

    try {

        const payload = {
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value.trim(),
            role: document.getElementById("role").value
        };

        console.log("LOGIN REQUEST:", payload);

        const res = await fetch("https://dis-empclearance.onrender.com/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        const data = await res.json();

        console.log("LOGIN RESPONSE:", data);

        if (!res.ok || !data.username) {
            alert("Invalid credentials");
            return;
        }

        localStorage.setItem("user", JSON.stringify(data));

        if (data.role === "admin") {
            window.location.href = "main_dashboard.html";
        }
        else if (data.role === "signatory") {
            window.location.href = "clearing_page.html";
        }
        else if (data.role === "teacher") {
            window.location.href = "teacher_page.html";
        }
        else {
            alert("Unknown role");
        }

    }
    catch (err) {
        console.error(err);
        alert("Server not responding. Check backend.");
    }
}

</script>

</body>
</html>
