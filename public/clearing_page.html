function searchEmployee() {

    const key = document.getElementById("searchBox").value;

    fetch(`http://localhost:5000/search/${key}`)
    .then(res => res.json())
    .then(data => {

        cache = data;

        let html = "";

        data.forEach((emp, i) => {
            html += `
                <div class="result" onclick="selectEmployee(${i})">
                    ${emp.employeelastname}, ${emp.employeename}
                </div>
            `;
        });

        document.getElementById("results").innerHTML = html;
    });
}

/* ================= SELECT EMPLOYEE ================= */
function selectEmployee(i) {

    const emp = cache[i];
    selected = emp;

    document.getElementById("searchBox").value =
        emp.employeelastname + ", " + emp.employeename;

    document.getElementById("results").innerHTML = "";

    /* EMP INFO */
    document.getElementById("empInfo").innerHTML = `
        <tr><td>Employee No</td><td>${emp.employeenumber}</td></tr>
        <tr><td>Name</td><td>${emp.employeename} ${emp.employeelastname}</td></tr>
        <tr><td>Department</td><td>${emp.department}</td></tr>
        <tr><td>Intent</td><td>${emp.intent}</td></tr>
    `;

    renderClearances(emp);
}

function renderClearances(emp) {

    const signatoryName = user.name.toUpperCase();

    let rows = "";

    // 🔥 FILTER ONLY ASSIGNED CLEARANCES
    const myClearances = (emp.clearances || []).filter(c =>
        c.clearingemployee.toUpperCase() === signatoryName
    );

    if (myClearances.length === 0) {
        rows = `<tr><td colspan="5">No assigned clearances</td></tr>`;
    } else {

        myClearances.forEach((c, index) => {

            rows += `
                <tr>
                    <td>${c.clearingdept}</td>
                    <td>${c.clearingemployee}</td>

                    <td>
                        <select id="status-${index}">
                            <option ${c.status === "Pending" ? "selected" : ""}>Pending</option>
                            <option ${c.status === "Cleared" ? "selected" : ""}>Cleared</option>
                            <option ${c.status === "Not Cleared" ? "selected" : ""}>Not Cleared</option>
                        </select>
                    </td>

                    <td>
                        <input class="comment" id="comment-${index}" value="${c.comments || ""}">
                    </td>

                    <td>
                        <button onclick="save(${index})">Save</button>
                    </td>
                </tr>
            `;
        });
    }

    document.getElementById("clearanceTable").innerHTML = rows;
}

function save(index) {

    const emp = selected;
    const signatoryName = user.name.toUpperCase();

    const updated = emp.clearances.map(c => {

        if (c.clearingemployee.toUpperCase() === signatoryName) {

            // find matching filtered index
            const filtered = emp.clearances.filter(x =>
                x.clearingemployee.toUpperCase() === signatoryName
            );

            const target = filtered[index];

            if (c._id === target._id) {
                return {
                    ...c,
                    status: document.getElementById(`status-${index}`).value,
                    comments: document.getElementById(`comment-${index}`).value
                };
            }
        }

        return c;
    });

    fetch(`http://localhost:5000/update/${emp._id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            ...emp,
            clearances: updated
        })
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);
        selectEmployee(cache.findIndex(x => x._id === emp._id));
    });
}

function loadAssignedTeachers() {

    fetch(`http://localhost:5000/teachersBySignatory/${user.name}`)
    .then(res => res.json())
    .then(data => {

        let rows = "";
        let index = 0;

        data
        .sort((a, b) => {

            const nameA =
                `${a.employeelastname} ${a.employeename}`.toLowerCase();

            const nameB =
                `${b.employeelastname} ${b.employeename}`.toLowerCase();

            return nameA.localeCompare(nameB);
        })

        .forEach(t => {

            t.clearances.forEach(c => {

                if (c.clearingemployee === user.name) {

                    rows += `
                    <tr>
                        <td>${t.employeenumber}</td>
                        <td>${t.employeelastname}, ${t.employeename}</td>
                        <td>${t.department}</td>
                        <td>${c.clearingdept}</td>

                        <td>
                            <select id="status-${index}">
                                <option ${c.status === "Pending" ? "selected" : ""}>Pending</option>
                                <option ${c.status === "Cleared" ? "selected" : ""}>Cleared</option>
                                <option ${c.status === "Not Cleared" ? "selected" : ""}>Not Cleared</option>
                            </select>
                        </td>

                        <td>
                            <input id="comment-${index}" value="${c.comments || ""}">
                        </td>

                        <td>
                            <button onclick="updateAssigned(${index}, '${t._id}', '${c.clearingdept}')">
                                Update
                            </button>
                        </td>
                    </tr>
                    `;

                    index++;
                }
            });
        });

        document.getElementById("assignedTable").innerHTML = rows;
    });
}


function updateAssigned(index, teacherId, dept) {

    const status = document.getElementById(`status-${index}`).value;
    const comments = document.getElementById(`comment-${index}`).value;

    fetch("http://localhost:5000/updateClearanceBySignatory", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            teacherId,
            dept,
            signatory: user.name,
            status,
            comments
        })
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);
        loadAssignedTeachers(); // refresh table
    });
}
