<script>
const path = window.location.pathname;

/* ================= ROLE RULES ================= */

const access = {
    admin: [
        "main_dashboard.html",
        "teacher_reg.html",
        "user_reg.html",
        "clearance_admindash.html"
    ],
    signatory: [
        "clearing_page.html",
        "clearance_dash.html"
    ],
    teacher: [
        "teacher_page.html"
    ]
};

const allowedPages = access[user.role] || [];

const currentPage = path.split("/").pop();

if (!allowedPages.includes(currentPage)) {
    alert("Access denied for your role.");
    window.location.href = allowedPages[0]; // redirect to first allowed page
}
</script>

fetch(`https://dis-empclearance.onrender.com/getTeacherByEmpNo/${user.username}`)
.then(res => res.json())
.then(emp => {

    let rows = "";

    if (!emp || !emp.clearances || emp.clearances.length === 0) {
        rows = `<tr><td colspan="4" class="empty">No clearance records found</td></tr>`;
    } else {

        emp.clearances.forEach(c => {

            let statusClass = "pending";

            if (c.status === "Cleared") statusClass = "cleared";
            if (c.status === "Not Cleared") statusClass = "not-cleared";

            rows += `
            <tr>
                <td>${c.clearingdept}</td>
                <td>${c.clearingemployee}</td>
                <td>
                    <span class="badge ${statusClass}">
                        ${c.status}
                    </span>
                </td>
                <td>${c.comments || "-"}</td>
            </tr>`;
        });
    }

    document.getElementById("table").innerHTML = rows;
});



</script>
