function addClearance(dept = "", employee = "") {

    const div = document.createElement("div");
    div.classList.add("clearance-row");

    div.innerHTML = `
        <input class="dept" placeholder="Department" value="${dept}">
        <input class="employee" placeholder="Signatory" value="${employee}">
        <button class="remove-btn" onclick="this.parentElement.remove()">X</button>
    `;

    document.getElementById("clearanceContainer").appendChild(div);
}

/* build payload matching MongoDB schema */
function getFormData() {

    const clearances = [];

    document.querySelectorAll(".clearance-row").forEach(row => {

        const dept = row.querySelector(".dept").value;
        const employee = row.querySelector(".employee").value;

        if (dept && employee) {
            clearances.push({
                clearingdept: dept,
                clearingemployee: employee,
                status: "Pending",
                comments: ""
            });
        }
    });

    return {
        employeenumber: document.getElementById("empno").value,
        employeelastname: document.getElementById("lname").value,
        employeename: document.getElementById("fname").value,
        department: document.getElementById("dept").value,
        intent: document.getElementById("intent").value,
        clearances
    };
}

/* SAVE */
function save() {

    const data = getFormData();

    fetch("https://dis-empclearance.onrender.com//addTeacher", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);

        // reset form
        document.querySelectorAll("input").forEach(i => i.value = "");
        document.getElementById("clearanceContainer").innerHTML = "";
    })
    .catch(err => console.log(err));
}

/* ================= SEARCH ================= */
function searchTeacher() {

    const key = document.getElementById("searchBox").value;

    fetch(`https://dis-empclearance.onrender.com//search/${key}`)
    .then(res => res.json())
    .then(data => {

        cache = data;

        let rows = "";

        data.forEach((t, i) => {

            rows += `
            <tr>
                <td><input value="${t.employeenumber}" id="empno-${i}"></td>
                <td><input value="${t.employeelastname}" id="lname-${i}"></td>
                <td><input value="${t.employeename}" id="fname-${i}"></td>
                <td><input value="${t.department}" id="dept-${i}"></td>
                <td><input value="${t.intent}" id="intent-${i}"></td>

                <td>
                    <button onclick="viewClearances(${i})">View Clearances</button>
                    <button onclick="updateTeacher('${t._id}', ${i})">Update</button>
                    <button onclick="deleteTeacher('${t._id}')">Delete</button>
                </td>
            </tr>
            `;
        });

        document.getElementById("resultTable").innerHTML = rows;
    });
}


/* ================= UPDATE ================= */
function updateTeacher(id, i) {

    const payload = {
        employeenumber: document.getElementById(`empno-${i}`).value,
        employeelastname: document.getElementById(`lname-${i}`).value,
        employeename: document.getElementById(`fname-${i}`).value,
        department: document.getElementById(`dept-${i}`).value,
        intent: document.getElementById(`intent-${i}`).value,
        clearances: cache[i].clearances
    };

    fetch(`https://dis-empclearance.onrender.com//update/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);
        searchTeacher();
    });
}

/* ================= DELETE ================= */
function deleteTeacher(id) {

    if (!confirm("Delete this teacher?")) return;

    fetch(`https://dis-empclearance.onrender.com//delete/${id}`, {
        method: "DELETE"
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);
        searchTeacher();
    });
}

function viewClearances(index) {

    const emp = cache[index];
    selectedTeacher = emp; // store selected teacher globally

    let rows = "";

    if (!emp.clearances || emp.clearances.length === 0) {
        rows = `<tr><td colspan="5">No clearances found</td></tr>`;
    } else {

        emp.clearances.forEach((c, i) => {

            rows += `
            <tr>
                <td>${c.clearingdept}</td>
                <td>${c.clearingemployee}</td>

                <td>
                    <select id="status-${i}">
                        <option value="Pending" ${c.status === "Pending" ? "selected" : ""}>Pending</option>
                        <option value="Cleared" ${c.status === "Cleared" ? "selected" : ""}>Cleared</option>
                        <option value="Not Cleared" ${c.status === "Not Cleared" ? "selected" : ""}>Not Cleared</option>
                    </select>
                </td>

                <td>
                    <input id="comment-${i}" value="${c.comments || ""}">
                </td>

                <td>
                    <button onclick="updateClearance(${i})">Update</button>
                    <button onclick="deleteClearance(${i})">Delete</button>
                </td>
            </tr>
            `;
        });
    }

    document.getElementById("clearanceTable").innerHTML = rows;
}

function updateClearance(i) {

    const t = selectedTeacher;

    const updatedClearances = t.clearances.map((c, index) => {

        if (index === i) {
            return {
                ...c,
                status: document.getElementById(`status-${i}`).value,
                comments: document.getElementById(`comment-${i}`).value
            };
        }

        return c;
    });

    fetch(`https://dis-empclearance.onrender.com//update/${t._id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            ...t,
            clearances: updatedClearances
        })
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);
        viewClearances(cache.findIndex(x => x._id === t._id));
    });
}

function deleteClearance(i) {

    const t = selectedTeacher;

    if (!confirm("Delete this clearance?")) return;

    const updatedClearances = t.clearances.filter((_, index) => index !== i);

    fetch(`https://dis-empclearance.onrender.com//update/${t._id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            ...t,
            clearances: updatedClearances
        })
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);
        viewClearances(cache.findIndex(x => x._id === t._id));
    });
}


/* add one default clearance row */
addClearance();

    `;
}

/* SIGNATORY LINKS */
else if (user.role === "signatory") {
    links += `
        <a href="clearing_page.html" style="color:white;text-decoration:none;">Clearing</a>
    `;
}

/* TEACHER LINKS */
else if (user.role === "teacher") {
    links += `
        <a href="teacher_page.html" style="color:white;text-decoration:none;">My Clearance</a>
    `;
}

navLinks.innerHTML = links;

function uploadExcel() {

    const file = document.getElementById("excelFile").files[0];

    if (!file) {
        alert("Please select an Excel file");
        return;
    }

    const formData = new FormData();
    formData.append("file", file);

    fetch("https://dis-empclearance.onrender.com//bulkUploadExcel", {
        method: "POST",
        body: formData
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);
    })
    .catch(err => console.log(err));
}

function downloadExcelTemplate() {

    const data = [
        ["1001", "Smith", "John", "HR", "Resignation", "HR", "Jane Doe"],
        ["1001", "Smith", "John", "HR", "Resignation", "Finance", "Mark Lee"],
        ["1002", "Cruz", "Anna", "IT", "Transfer", "IT", "Juan Reyes"]
    ];

    const ws = XLSX.utils.aoa_to_sheet([
        ["EmployeeNo", "LastName", "FirstName", "Department", "Intent", "ClearanceDept", "Signatory"],
        ...data
    ]);

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "TeachersTemplate");

    XLSX.writeFile(wb, "teacher_upload_template.xlsx");
}

</script>
